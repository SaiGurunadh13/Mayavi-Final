# Netlify Configuration for Mayavi Technology Club
[build]
  publish = "."

# Proxy API calls directly to the deployed FastAPI backend
# Replace https://YOUR-ACTUAL-BACKEND-DOMAIN with your real deployed backend address (e.g. https://mayavi-api.onrender.com)
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-ACTUAL-BACKEND-DOMAIN/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://YOUR-ACTUAL-BACKEND-DOMAIN/uploads/:splat"
  status = 200
  force = true
