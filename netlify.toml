# Netlify Configuration for Mayavi Technology Club
[build]
  publish = "."

# Proxy API calls directly to the deployed FastAPI backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://mayavi-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://mayavi-api.onrender.com/uploads/:splat"
  status = 200
  force = true
